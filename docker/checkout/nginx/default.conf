# ============================================================================
# NEXVION :: checkout service
# ----------------------------------------------------------------------------
# Owns the payment step of the order funnel.
#   payment.html, payment.js, payment.css
#
# Deployed at the public path /payment.html on the shared NEXVION hostname.
#
# Why checkout is worth isolating from the store-front even though the checkout
# page is a single static document:
#
#   1. Blast radius. checkout is the only surface that collects an address, a
#      phone number, a PIN and card data. It gets its own NetworkPolicy, its own
#      resource limits, its own replica count and its own WAF rules, so a
#      traffic spike or a bad release against browsing cannot affect it.
#   2. Release cadence. The store-front changes with merchandising; checkout
#      changes with compliance. They do not belong in one atomic release.
#   3. Audit boundary. Anything touching payment data should be identifiable as
#      its own workload — its own image, its own image digest, its own deploy
#      history — rather than a subset of a larger bundle.
#
# What this service does NOT do, and cannot do: validate or process payment.
# payment.js is client-side demo logic (see README.txt in the repository root).
# No card number leaves the browser. The security work here is about how the
# page is delivered, not about a transaction pipeline.
# ============================================================================

upstream nexvion_checkout {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    autoindex off;

    include /etc/nginx/includes/security-headers.conf;

    # -----------------------------------------------------------------------
    # Health probes
    # -----------------------------------------------------------------------
    location = /healthz {
        access_log           off;
        include /etc/nginx/includes/security-headers.conf;
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /readyz {
        access_log           off;
        include /etc/nginx/includes/security-headers.conf;
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ready\n";
    }

    location = /version.json {
        default_type application/json;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /nginx_status {
        stub_status;
        access_log off;
        include /etc/nginx/includes/security-headers.conf;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }

    # -----------------------------------------------------------------------
    # Cache policy
    # -----------------------------------------------------------------------
    # Fixed asset filenames (payment.html references payment.css by name), so
    # revalidate rather than cache hard. Same reasoning as the store-front.
    location ~* \.(?:css|js)$ {
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.html$ {
        # Re-included because this location declares add_header (see
        # includes/security-headers.conf). `expires` is NOT used here: it emits
        # its own Cache-Control, which would combine with add_header and send the
        # header twice with two different values.
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Custom error pages
    # -----------------------------------------------------------------------
    # A failed checkout is a worse experience than a failed page view, so the 503
    # copy tells the shopper their basket is safe in the browser.
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        internal;
        include /etc/nginx/includes/security-headers.conf;
        # no-store: an intermediary (the ALB) must not cache a 404 for a URL
        # that may well return 200 after the next deployment.
        add_header Cache-Control "no-store" always;
    }

    location = /50x.html {
        internal;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Block dotfiles (.env, .git, editor swap files) outright.
    location ~ /\. {
        deny       all;
        access_log off;
        log_not_found off;
    }

    # -----------------------------------------------------------------------
    # Content
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }
}