# ============================================================================
# NEXVION :: asset service
# ----------------------------------------------------------------------------
# Owns the brand binaries: /logo.png
#
# A separate origin for immutable binary content is a standard split, not an
# artificial one. It buys three things:
#
#   1. Independent cache policy. Static assets want a long TTL and no
#      revalidation; HTML wants none. Forcing one nginx instance to serve both
#      means one compromise for both. Here the asset tier alone can carry a
#      multi-day TTL without any risk of serving stale HTML.
#   2. Independent scaling. Shop traffic and logo traffic have completely
#      different shapes. Decoupling them means a sale on the catalogue cannot
#      evict the logo that every page depends on.
#   3. Blast radius. There is no user input, no session, no form. It can be
#      locked down far more aggressively than the other two services.
#
# Routing note: /logo.png is requested by all three pages. The ALB routes that
# one path here, and the browser only ever sees a single origin, so the
# application needed no change to reference it.
# ============================================================================

upstream nexvion_assets {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    autoindex off;

    include /etc/nginx/includes/security-headers.conf;

    # -----------------------------------------------------------------------
    # Health probes
    # -----------------------------------------------------------------------
    location = /healthz {
        access_log           off;
        include /etc/nginx/includes/security-headers.conf;
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /readyz {
        access_log           off;
        include /etc/nginx/includes/security-headers.conf;
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ready\n";
    }

    location = /version.json {
        default_type application/json;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /nginx_status {
        stub_status;
        access_log off;
        include /etc/nginx/includes/security-headers.conf;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }

    # -----------------------------------------------------------------------
    # Binary assets
    # -----------------------------------------------------------------------
    # One hour plus must-revalidate. Long enough to remove almost all repeat
    # traffic, short enough that swapping the logo propagates the same day.
    #
    # `immutable` is intentionally absent: the pages reference /logo.png by a
    # fixed name, so a browser holding an immutable response would ignore the
    # new image until the cache expired — up to a year — even after a correct
    # redeployment.
    location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|woff2?)$ {
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
        access_log off;
    }

    # The asset tier serves binaries only. Any document request gets the 404
    # page rather than being silently proxied or listed.
    location ~* \.html$ {
        error_page 404 /404.html;
        internal;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        internal;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /50x.html {
        internal;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location ~ /\. {
        deny       all;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri =404;
    }
}