# ============================================================================
# NEXVION :: store-front service
# ----------------------------------------------------------------------------
# Owns the browse experience: the home page and the catalogue.
#   index.html, products.html, script.js, style.css, products.css
#
# Served at the public path prefix / on the shared NEXVION hostname, alongside
# /payment.html (checkout service) and /logo.png (asset service). Keeping every
# service behind ONE hostname is what allows the application's relative links
# (index.html <-> products.html <-> payment.html, plus logo.png) to keep working
# untouched — the ALB resolves the path, the browser never sees a second origin.
# ============================================================================

upstream nexvion_storefront {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen      8080 default_server;
    listen      [::]:8080 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    autoindex off;

    # Default headers for locations that do not declare their own add_header.
    include /etc/nginx/includes/security-headers.conf;

    # -----------------------------------------------------------------------
    # Health probes
    # -----------------------------------------------------------------------
    # access_log off keeps probe traffic out of the request-rate metrics and the
    # ALB access log noise, which matters because Kubernetes hits /healthz every
    # 10 seconds per pod.
    location = /healthz {
        access_log           off;
        include /etc/nginx/includes/security-headers.conf;
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /readyz {
        access_log           off;
        include /etc/nginx/includes/security-headers.conf;
        add_header Content-Type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ready\n";
    }

    # -----------------------------------------------------------------------
    # Build metadata (written by the builder stage, never by the app source)
    # -----------------------------------------------------------------------
    location = /version.json {
        default_type application/json;
        # Re-included: this location declares add_header, which discards every
        # add_header inherited from server{} (see includes/security-headers.conf).
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # -----------------------------------------------------------------------
    # nginx stub_status, for the Prometheus nginx-exporter sidecar
    # -----------------------------------------------------------------------
    # Restricted to in-cluster and VPC CIDRs. The exporter scrapes it; browsers
    # must not, and this endpoint leaks connection and request counters.
    location = /nginx_status {
        stub_status;
        access_log off;
        include /etc/nginx/includes/security-headers.conf;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }

    # -----------------------------------------------------------------------
    # Cache policy
    # -----------------------------------------------------------------------
    # IMPORTANT — no `immutable` and no long max-age, deliberately.
    #
    # The application references its assets by fixed name: <link href="style.css">
    # in every document. Content-hashed filenames (style.a1b2c3.css) are the
    # only way to safely serve static files with a one-year immutable cache,
    # and adopting them would mean editing the provided HTML — which is out of
    # scope for this project.
    #
    # So instead: always revalidate, and let the browser get a cheap 304 when
    # nothing changed. nginx emits ETag and Last-Modified by default. This costs
    # one conditional request per asset per page load and guarantees a
    # redeployment is picked up immediately rather than after a cache TTL.
    location ~* \.(?:css|js)$ {
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.html$ {
        # Re-included because this location declares add_header (see
        # includes/security-headers.conf). `expires` is NOT used here: it emits
        # its own Cache-Control, which would combine with add_header and send the
        # header twice with two different values.
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Custom error pages
    # -----------------------------------------------------------------------
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = /404.html {
        internal;
        include /etc/nginx/includes/security-headers.conf;
        # no-store: an intermediary (the ALB) must not cache a 404 for a URL
        # that may well return 200 after the next deployment.
        add_header Cache-Control "no-store" always;
    }

    location = /50x.html {
        internal;
        include /etc/nginx/includes/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # Block dotfiles (.env, .git, editor swap files) outright.
    location ~ /\. {
        deny       all;
        access_log off;
        log_not_found off;
    }

    # -----------------------------------------------------------------------
    # Content
    # -----------------------------------------------------------------------
    # try_files $uri $uri/ =404 is the static equivalent of a router: it serves
    # the exact file if it exists, otherwise falls through to our 404 page.
    location / {
        try_files $uri $uri/ =404;
    }
}