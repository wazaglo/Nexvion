# ============================================================================
# NEXVION — response security headers
# ============================================================================
# Included from server{} and from every location{} that declares its own
# add_header directive.
#
# WHY THE REPEATED INCLUDE (this trips up almost everyone):
# nginx's add_header directives are NOT additive down the config tree. If a
# location block declares even one add_header, every add_header inherited from
# the enclosing server{} block is discarded. The naive approach — declare the
# security headers once at server level and set Cache-Control per location —
# therefore silently strips ALL security headers from every static asset.
#
# The fix is to re-include this file inside any location that sets add_header.
# Every location in conf.d/default.conf that contains add_header does exactly
# that, and the comment there repeats this rule.
# ============================================================================

# ---------------------------------------------------------------------------
# Content-Security-Policy
# ---------------------------------------------------------------------------
# Every source below is a hard requirement of the provided application. Removing
# any one of them breaks the site in a way that looks like a bug rather than a
# misconfiguration:
#
#   images.unsplash.com  all 12 product images + hero + category cards
#                        (hardcoded in script.js:15 and index.html)
#   placehold.co         onerror fallback image for failed product loads
#                        (script.js:555, payment.js:122)
#   fonts.googleapis.com the <link> to the DM Sans / Playfair Display CSS
#   fonts.gstatic.com    the actual .woff2 font binaries that CSS points at
#   data:                fonts and inline images
#
# Note on script-src-attr: the app uses ONE inline event handler per page —
# onerror="this.onerror=null;this.src='https://placehold.co/...'" in
# script.js:555 and payment.js:122. A plain `script-src 'self'` blocks inline
# event handlers, which would break image fallbacks. script-src-attr scopes the
# exception to event-handler attributes only, so no inline <script> block is
# permitted anywhere.
#
# Note on style-src 'unsafe-inline': script.js injects inline style="" attributes
# when rendering the empty-cart state (script.js:407-411). 'unsafe-inline' is
# used here rather than the narrower style-src-attr purely for browser
# compatibility; the correct future fix is to move those styles into a CSS class
# in style.css, after which this token can be dropped.
#
# `upgrade-insecure-requests` is intentionally NOT set. TLS is terminated at
# the Application Load Balancer, which already issues a 301 for plain HTTP, so
# the header would be redundant in production — and it would actively break
# local testing over http://localhost:8080 by rewriting every subresource URL.
#
# HSTS is present but is a no-op over plain HTTP, so local testing is unaffected.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https://images.unsplash.com https://placehold.co; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; script-src-attr 'unsafe-inline'; connect-src 'self'; manifest-src 'self'" always;

# ---------------------------------------------------------------------------
# Transport security
# ---------------------------------------------------------------------------
# Ignored by browsers over plain HTTP, so this is safe to ship in the same image
# that serves local development.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ---------------------------------------------------------------------------
# Content and framing
# ---------------------------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;

# X-XSS-Protection is explicitly DISABLED (recommended value is "0"). The legacy
# XSS auditor it enabled was itself exploitable and has been removed from all
# current browsers, so advertising it only creates false confidence.
add_header X-XSS-Protection "0" always;

# ---------------------------------------------------------------------------
# Referrer, browser capabilities and cross-origin isolation
# ---------------------------------------------------------------------------
# payment.html collects an address, phone number and PIN; none of that should
# leak to a third-party host via the Referer header on navigation.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The storefront needs no camera, microphone, geolocation, USB or payment API.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), interest-cohort=()" always;

# Prevents the opened document from sharing a browsing-context group with
# cross-origin popups, which is the basis of tabnabbing attacks.
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Removes the Referer header entirely on downgrade requests only; permissive
# enough for the Unsplash and Google Fonts assets the page depends on.
add_header Cross-Origin-Resource-Policy "same-origin" always;

# ---------------------------------------------------------------------------
# Server fingerprinting
# ---------------------------------------------------------------------------
# server_tokens off in nginx.conf hides the version; this also strips the
# header the stock image advertises on error pages.
add_header ServerTokens "hide" always;