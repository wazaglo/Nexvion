# ============================================================================
# NEXVION — nginx main configuration
# ============================================================================
# Replaces the image's stock /etc/nginx/nginx.conf entirely. Three deliberate
# departures from the default, all driven by running the container with a
# read-only root filesystem and a non-root user (see helm/nexvion):
#
#   1. No `user` directive   -> the master process already runs as uid 101, and
#                               nginx warns if `user` is set when non-root.
#   2. PID + all temp paths  -> moved under /tmp, which is the one writable
#     live in /tmp             path Kubernetes gives us via an emptyDir mount.
#   3. Logs to /dev/stdout   -> no log files on disk, so the read-only root
#     and /dev/stderr          filesystem needs no extra mount, and the JSON
#                               access log can be collected by stdout scraping.
# ============================================================================

worker_processes  auto;

# /tmp is writable even when / is mounted read-only.
pid               /tmp/nginx.pid;

# Warnings and above go to stderr for the container log collector.
error_log         /dev/stderr warn;

events {
    worker_connections  1024;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -----------------------------------------------------------------------
    # Structured access log
    # -----------------------------------------------------------------------
    # JSON rather than the stock `combined` format so the observability stack
    # (Loki / CloudWatch Logs Insights / Fluent Bit) can query fields instead of
    # regex-scraping a concatenated string. $request_id gives us a value that
    # correlates an ALB access-log entry, an nginx line and a container log.
    log_format  json_combined  escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"x_forwarded_for":"$http_x_forwarded_for",'
            '"method":"$request_method",'
            '"uri":"$uri",'
            '"status":$status,'
            '"bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"referrer":"$http_referer",'
            '"user_agent":"$http_user_agent",'
            '"request_id":"$request_id"'
        '}';

    access_log  /dev/stdout  json_combined;

    # -----------------------------------------------------------------------
    # Performance
    # -----------------------------------------------------------------------
    sendfile              on;
    tcp_nopush            on;
    tcp_nodelay           on;
    keepalive_timeout     65;
    types_hash_max_size   2048;
    server_tokens         off;   # never advertise the nginx version

    # -----------------------------------------------------------------------
    # Client body / timeouts (defensive defaults)
    # -----------------------------------------------------------------------
    client_max_body_size      1m;
    client_body_timeout       10s;
    client_header_timeout     10s;
    send_timeout              30s;
    reset_timedout_connection on;

    # -----------------------------------------------------------------------
    # Temp paths relocated under /tmp
    # -----------------------------------------------------------------------
    # The stock image points these at /var/cache/nginx, which is not writable
    # by uid 101 and definitely not on a read-only root filesystem. They are
    # unused when serving pure static content but must be valid at parse time.
    client_body_temp_path  /tmp/client_temp;
    proxy_temp_path        /tmp/proxy_temp;
    fastcgi_temp_path      /tmp/fastcgi_temp;
    uwsgi_temp_path        /tmp/uwsgi_temp;
    scgi_temp_path         /tmp/scgi_temp;

    # -----------------------------------------------------------------------
    # Compression
    # -----------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   512;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml;

    # -----------------------------------------------------------------------
    # Virtual hosts
    # -----------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}