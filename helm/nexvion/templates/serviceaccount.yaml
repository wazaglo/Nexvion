{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nexvion.serviceAccountName" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "nexvion.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- /*
automountServiceAccountToken: false comes from values (default false). These pods
serve static files and never call the Kubernetes API, so mounting an API token
would hand every container a credential it has no use for. Under the namespace's
Restricted Pod Security Standard this also keeps the projection from being
flagged.
*/}}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}